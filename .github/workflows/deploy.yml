# Deploy the static export to the Cloudflare Worker on push to main.
#
# This exists because production silently fell three weeks behind main: the
# site was deployed by hand on 2026-07-28 and nothing shipped after, including
# the entire design-polish pass. "Deploys on push" was claimed in a commit
# message but was never true in this repo.
#
# Requires ONE repo secret: CLOUDFLARE_API_TOKEN, issued from the client
# account (Quesofoods22@gmail.com) with the "Edit Cloudflare Workers" template.
# The account is pinned in wrangler.jsonc, so no account secret is needed.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-deploy from the Actions tab without a commit

concurrency:
  group: deploy-production
  cancel-in-progress: false # never interrupt a half-finished asset upload

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Fail the deploy on a type error rather than shipping a broken export.
      - run: npm run build

      # Guard the v4 constitution rule: placeholder scaffolding must never
      # reach a customer. Cheap here, and it fails loudly if someone reverts
      # the SHOW_PLACEHOLDERS gating by accident.
      # CLAUDE.md v5 inverted the contrast rules when the ground moved from
      # near-black to cream: red became usable as text, yellow became unusable.
      # A human reviewing a diff will not spot a 1.1:1 pairing; this will.
      - name: Assert colour contrast meets WCAG AA
        run: npm run check:contrast

      # NOT YET WIRED IN: `npm run check:rendered` walks the built pages in a
      # headless browser and measures what a visitor actually sees. It is the
      # only check that catches a component applying `text-queso-cream` on the
      # now-cream ground — check:contrast above validates the palette and
      # passes clean while 73 elements render at 1.04:1. Add it here at the end
      # of Phase 3, once Home/Menu/Contact are migrated off the v4 dark-ground
      # classes; enabling it before then just pins CI red on known work.

      # next.config.ts sets images.unoptimized, so every byte in public/images
      # is downloaded at full size by a phone on a Zambian mobile network.
      # A 33 MB photography drop landed in that folder on 2026-08-19; this
      # would have caught it before the deploy did.
      - name: Assert the image budget holds
        run: npm run check:images

      - name: Assert no placeholder scaffolding in the export
        run: |
          if grep -rl --include='*.html' --include='*.txt' -e 'PLACEHOLDER' -e 'Photography pending' out/; then
            echo "::error::Placeholder scaffolding found in the production export"
            exit 1
          fi
          echo "clean"

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
